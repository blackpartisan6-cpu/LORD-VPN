name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q LordVPN-Android.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: |
          cd LordVPN
          mkdir -p app/libs
          curl -fL -o app/libs/libv2ray.aar https://github.com/2dust/AndroidLibXrayLite/releases/latest/download/libv2ray.aar || true
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LordVPN-apk
          path: LordVPN/app/build/outputs/apk/debug/app-debug.apk
